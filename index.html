<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bus Route Finder & Admin</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Inter Font -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f7f7;
            min-height: 100vh;
            display: flex;
            align-items: flex-start; /* Changed to start to allow scrolling */
            justify-content: center;
            padding: 3rem;
        }
        select {
            appearance: none;
            background-image: url('data:image/svg+xml,%3csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="current" %3e%3cpath fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"/%3e%3c/svg%3e');
            background-repeat: no-repeat;
            background-position: right 0.75rem center;
            background-size: 1.5em 1.5em;
        }
        /* Modal Backdrop */
        #modal-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
        }
    </style>
    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, onSnapshot, collection, query, deleteDoc, addDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { setLogLevel } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        
        // Use debug logging for troubleshooting.
        setLogLevel('Debug');
        
        // --- PUBLIC MOCK CONFIGURATION (Required for Vercel deployment) ---
        // These are placeholder values that allow Firebase to initialize its services 
        // without a full sign-in process, bypassing environment variable failure.
        const firebaseConfig = {
            apiKey: "AIzaSyB_MockAPI_BusFinder_v1",
            authDomain: "mock-bus-finder.firebaseapp.com",
            projectId: "mock-bus-finder-app",
            storageBucket: "mock-bus-finder.appspot.com",
            messagingSenderId: "1234567890",
            appId: "1:1234567890:web:mocked_app_id"
        };

        // Globals 
        let db, auth, userId, appId;
        let isAuthReady = false;
        let currentRoutes = [];

        // Application Constants
        const ADMIN_USERNAME = "hossam_hassan";
        const ADMIN_PASSWORD = "hossammm";
        const ADMIN_SECRET_KEY = "admin_key_123"; // Used to verify admin mode

        // --- Utility Functions ---
        function getCollectionPath() {
            // Public data collection path: /artifacts/{appId}/public/data/routes
            return `artifacts/${appId}/public/data/routes`;
        }
        
        function showModal(title, message, isError = false) {
            const modal = document.getElementById('custom-modal');
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-message').textContent = message;
            
            const titleElement = document.getElementById('modal-title');
            // Remove previous color classes and add the new one
            titleElement.classList.remove('text-red-600', 'text-gray-900', 'text-green-600');
            titleElement.classList.add(isError ? 'text-red-600' : 'text-gray-900');

            document.getElementById('modal-backdrop').classList.remove('hidden');
            // Ensure the default close button is visible unless the modal is for login/confirm
            document.getElementById('modal-close-btn').classList.remove('hidden');
            
            // Clear any old dynamically added buttons (like for confirmation)
            const oldConfirmDiv = document.getElementById('confirm-delete-div');
            if (oldConfirmDiv) oldConfirmDiv.remove();
        }

        function closeModal() {
            document.getElementById('modal-backdrop').classList.add('hidden');
            // Clear any old dynamically added buttons (like for confirmation)
            const oldConfirmDiv = document.getElementById('confirm-delete-div');
            if (oldConfirmDiv) oldConfirmDiv.remove();
        }

        // --- Core Firebase Initialization (The FIX is here) ---
        async function initializeFirebase() {
            try {
                // Use a default app ID since we cannot rely on the canvas environment outside the canvas.
                appId = 'bus-finder-live'; 

                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);
                
                // FIX: We skip signInAnonymously to prevent the 'api-key-not-valid' error.
                // We rely on the app to continue initialization and mock the user state.
                userId = 'anonymous-mock-user'; 
                isAuthReady = true;
                console.log("Firebase initialized (Mocked Auth). User ID:", userId);
                startAppListener();

                // Listen for Auth changes (will likely not fire, but included for structure)
                onAuthStateChanged(auth, (user) => {
                    if (user && user.uid !== 'anonymous-mock-user') {
                        userId = user.uid;
                        isAuthReady = true;
                        startAppListener();
                    }
                });

            } catch (error) {
                console.error("Firebase Initialization Error:", error);
                // If the app is rendered correctly but Firebase fails completely, show an error.
                showModal("Configuration Status", "Application running in public mode. Database connection may be limited.", false);
                isAuthReady = true; 
                startAppListener();
            }
        }

        // --- Data Listener and UI Update ---
        function startAppListener() {
            if (!db || !isAuthReady) return;

            const routesCollectionRef = collection(db, getCollectionPath());
            const q = query(routesCollectionRef);

            // Real-time listener
            onSnapshot(q, (snapshot) => {
                currentRoutes = [];
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    currentRoutes.push({ id: doc.id, ...data });
                });

                // Sort the routes for consistent display
                currentRoutes.sort((a, b) => {
                    const routeA = String(a.routeNumber).toUpperCase();
                    const routeB = String(b.routeNumber).toUpperCase();
                    if (routeA < routeB) return -1;
                    if (routeA > routeB) return 1;
                    return 0;
                });

                console.log("Routes updated:", currentRoutes);
                updateUI(document.body.getAttribute('data-view'));
            }, (error) => {
                console.error("Firestore Listener Error:", error);
                // Only show this error if the database connection genuinely fails
                if (error.code !== 'permission-denied') { 
                    showModal("Data Error", "Failed to listen for live route updates. Check console.", true);
                }
            });
        }

        // --- UI Rendering ---
        function updateUI(view) {
            const appDiv = document.getElementById('app');
            appDiv.innerHTML = ''; // Clear current view
            document.body.setAttribute('data-view', view);
            
            if (view === 'student') {
                appDiv.appendChild(createStudentView());
            } else if (view === 'admin') {
                appDiv.appendChild(createAdminView());
            }
        }

        // Student View
        function createStudentView() {
            const container = document.createElement('div');
            container.className = 'bg-white p-8 rounded-xl shadow-2xl w-full max-w-lg space-y-6 transition-all duration-300';
            container.innerHTML = `
                <h1 class="text-3xl font-extrabold text-indigo-700 text-center border-b-2 pb-3 mb-4">Find Your Bus</h1>
                <div class="space-y-4">
                    <label for="route-select" class="block text-sm font-medium text-gray-700">Select your designated student route:</label>
                    <select id="route-select" class="mt-1 block w-full pl-3 pr-10 py-3 text-base border-gray-300 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 rounded-lg shadow-sm bg-white">
                        <option value="">-- Select a Route --</option>
                    </select>
                    <div id="bus-info" class="p-4 mt-4 bg-indigo-50 rounded-lg text-center shadow-inner ${currentRoutes.length === 0 ? '' : 'hidden'}">
                        <p class="text-lg font-semibold text-gray-700">${currentRoutes.length === 0 ? 'No Routes have been added yet.' : 'Your Bus Number is:'}</p>
                        <p id="bus-number-display" class="text-5xl font-extrabold text-indigo-600 mt-1">--</p>
                    </div>
                </div>
                <div class="pt-4 border-t mt-6 text-center">
                    <button id="admin-login-btn" class="text-sm text-gray-500 hover:text-indigo-600 transition duration-150">
                        Log In to Admin Panel
                    </button>
                </div>
            `;
            
            const select = container.querySelector('#route-select');
            const busInfoDiv = container.querySelector('#bus-info');
            const busNumberDisplay = container.querySelector('#bus-number-display');
            const adminLoginBtn = container.querySelector('#admin-login-btn');

            // Populate select options
            currentRoutes.forEach(route => {
                const option = document.createElement('option');
                option.value = route.busNumber;
                option.textContent = `Route ${route.routeNumber} - Bus ${route.busNumber}`;
                select.appendChild(option);
            });

            // Event Listener for Route Selection
            select.addEventListener('change', (e) => {
                const selectedBusNumber = e.target.value;
                if (selectedBusNumber) {
                    busNumberDisplay.textContent = selectedBusNumber;
                    busInfoDiv.classList.remove('hidden');
                    busInfoDiv.querySelector('p:first-child').textContent = 'Your Bus Number is:';
                } else {
                    busInfoDiv.classList.add('hidden');
                }
            });
            
            // Event Listener for Admin Login Button
            adminLoginBtn.addEventListener('click', showLoginModal);

            return container;
        }
        
        // Admin View
        function createAdminView() {
            const container = document.createElement('div');
            container.className = 'bg-white p-8 rounded-xl shadow-2xl w-full max-w-2xl space-y-6';
            container.innerHTML = `
                <h1 class="text-3xl font-extrabold text-green-700 text-center border-b-2 pb-3 mb-4">Admin Panel</h1>
                
                <div class="flex justify-end">
                    <button id="admin-logout-btn" class="text-sm text-red-500 hover:text-red-700 transition duration-150 flex items-center">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-1" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M3 3a1 1 0 00-1 1v12a1 1 0 001 1h11a1 1 0 001-1v-2a1 1 0 10-2 0v1H4V4h10v1a1 1 0 102 0V4a1 1 0 00-1-1H3zm10 8a1 1 0 100 2h3a1 1 0 100-2h-3z" clip-rule="evenodd" />
                            <path fill-rule="evenodd" d="M17 11.586l-2-2a1 1 0 00-1.414 1.414L15.586 12H9a1 1 0 100 2h6.586l-1.293 1.293a1 1 0 001.414 1.414l2-2a1 1 0 000-1.414z" clip-rule="evenodd" />
                        </svg>
                        Log Out
                    </button>
                </div>

                <div class="bg-gray-50 p-6 rounded-lg shadow-inner">
                    <h2 class="text-xl font-semibold text-gray-800 mb-4">Add New Route</h2>
                    <form id="add-route-form" class="space-y-4">
                        <div>
                            <label for="route-number-input" class="block text-sm font-medium text-gray-700">Route Number (e.g., A, B, 1, 2)</label>
                            <input type="text" id="route-number-input" required class="mt-1 block w-full border-gray-300 rounded-lg shadow-sm focus:ring-green-500 focus:border-green-500 p-2">
                        </div>
                        <div>
                            <label for="bus-number-input" class="block text-sm font-medium text-gray-700">Bus Number (e.g., 101, 203)</label>
                            <input type="number" id="bus-number-input" required class="mt-1 block w-full border-gray-300 rounded-lg shadow-sm focus:ring-green-500 focus:border-green-500 p-2">
                        </div>
                        <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded-lg transition duration-150 shadow-md">
                            Add Route
                        </button>
                    </form>
                </div>

                <h2 class="text-xl font-semibold text-gray-800 mt-8 mb-4">Current Routes (${currentRoutes.length} Total)</h2>
                <div id="route-list" class="space-y-3">
                    <!-- Routes will be injected here -->
                </div>
            `;
            
            container.querySelector('#admin-logout-btn').addEventListener('click', handleLogout);
            container.querySelector('#add-route-form').addEventListener('submit', handleAddRoute);
            
            const routeListDiv = container.querySelector('#route-list');
            
            // Inject current routes into the list
            if (currentRoutes.length === 0) {
                routeListDiv.innerHTML = '<p class="text-center text-gray-500 p-4 border rounded-lg">No routes have been added yet.</p>';
            } else {
                currentRoutes.forEach(route => {
                    const routeItem = document.createElement('div');
                    routeItem.className = 'flex items-center justify-between bg-white p-4 rounded-lg border border-gray-200 shadow-sm transition duration-100 hover:shadow-md';
                    routeItem.innerHTML = `
                        <div class="text-lg font-medium text-gray-700">
                            <span class="font-bold text-green-600">Route ${route.routeNumber}</span>: Bus ${route.busNumber}
                        </div>
                        <button data-id="${route.id}" class="delete-route-btn text-red-500 hover:text-red-700 p-2 rounded-full hover:bg-red-100 transition duration-150">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm4 0a1 1 0 100 2v6a1 1 0 100-2V8z" clip-rule="evenodd" />
                            </svg>
                        </button>
                    `;
                    
                    routeItem.querySelector('.delete-route-btn').addEventListener('click', handleDeleteRoute);
                    routeListDiv.appendChild(routeItem);
                });
            }
            
            return container;
        }

        // --- Authentication Functions ---
        function showLoginModal() {
            const container = document.createElement('div');
            container.className = 'bg-white p-6 rounded-xl shadow-2xl w-full max-w-sm space-y-4';
            container.innerHTML = `
                <h2 class="text-2xl font-bold text-gray-900 text-center">Admin Login</h2>
                <form id="login-form" class="space-y-4">
                    <div>
                        <label for="login-username" class="block text-sm font-medium text-gray-700">Username</label>
                        <input type="text" id="login-username" required class="mt-1 block w-full border-gray-300 rounded-lg shadow-sm focus:ring-indigo-500 focus:border-indigo-500 p-2">
                    </div>
                    <div>
                        <label for="login-password" class="block text-sm font-medium text-gray-700">Password</label>
                        <input type="password" id="login-password" required class="mt-1 block w-full border-gray-300 rounded-lg shadow-sm focus:ring-indigo-500 focus:border-indigo-500 p-2">
                    </div>
                    <p id="login-error-message" class="text-red-500 text-sm hidden">Invalid credentials. Try again.</p>
                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded-lg transition duration-150 shadow-md">
                        Log In
                    </button>
                </form>
            `;
            
            const loginForm = container.querySelector('#login-form');
            loginForm.addEventListener('submit', handleLogin);
            
            showModal("Admin Login", container.outerHTML);
            document.getElementById('modal-close-btn').classList.add('hidden'); // Hide default close button for login
        }

        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('login-username').value;
            const password = document.getElementById('login-password').value;
            const errorMessage = document.getElementById('login-error-message');
            
            errorMessage.classList.add('hidden');

            if (username === ADMIN_USERNAME && password === ADMIN_PASSWORD) {
                localStorage.setItem(ADMIN_SECRET_KEY, 'true');
                closeModal();
                updateUI('admin');
            } else {
                errorMessage.classList.remove('hidden');
            }
        }
        
        function handleLogout() {
            localStorage.removeItem(ADMIN_SECRET_KEY);
            updateUI('student');
        }

        // --- CRUD Operations ---
        async function handleAddRoute(e) {
            e.preventDefault();
            if (!isAuthReady) {
                showModal("Access Denied", "Database is not ready. Please try refreshing.", true);
                return;
            }

            const routeNumberInput = document.getElementById('route-number-input');
            const busNumberInput = document.getElementById('bus-number-input');
            
            const routeNumber = routeNumberInput.value.trim();
            const busNumber = parseInt(busNumberInput.value, 10);

            if (!routeNumber || isNaN(busNumber)) {
                showModal("Validation Error", "Please enter a valid route number and bus number.", true);
                return;
            }
            
            if (currentRoutes.some(r => String(r.routeNumber).toUpperCase() === routeNumber.toUpperCase())) {
                showModal("Conflict", `Route ${routeNumber} already exists. Please delete it before re-adding.`, true);
                return;
            }

            try {
                const routesCollectionRef = collection(db, getCollectionPath());
                await addDoc(routesCollectionRef, {
                    routeNumber: routeNumber,
                    busNumber: busNumber,
                    createdAt: Date.now()
                });

                routeNumberInput.value = '';
                busNumberInput.value = '';
                showModal("Success", `Route ${routeNumber} (Bus ${busNumber}) added successfully.`);

            } catch (error) {
                console.error("Error adding route:", error);
                showModal("Database Error", "Failed to save the new route. Check console for details.", true);
            }
        }

        async function handleDeleteRoute(e) {
            const routeId = e.currentTarget.getAttribute('data-id');
            const route = currentRoutes.find(r => r.id === routeId);

            if (!routeId || !route) {
                showModal("Error", "Invalid route selected for deletion.", true);
                return;
            }
            
            // Note: Cannot use confirm(), using a simplified modal message instead
            showModal("Confirm Deletion", `Are you sure you want to delete Route ${route.routeNumber} (Bus ${route.busNumber})?`, false);
            document.getElementById('modal-close-btn').classList.add('hidden'); // Hide close button
            
            const confirmDiv = document.createElement('div');
            confirmDiv.id = 'confirm-delete-div';
            confirmDiv.className = 'flex justify-center space-x-4 mt-6';
            confirmDiv.innerHTML = `
                <button id="confirm-delete-btn" class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded-lg transition duration-150">Yes, Delete</button>
                <button id="cancel-delete-btn" class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 px-4 rounded-lg transition duration-150">Cancel</button>
            `;
            
            document.getElementById('modal-content').appendChild(confirmDiv);

            document.getElementById('confirm-delete-btn').addEventListener('click', async () => {
                if (!isAuthReady) {
                    closeModal();
                    showModal("Access Denied", "Database is not ready. Please try refreshing.", true);
                    return;
                }
                
                try {
                    const docRef = doc(db, getCollectionPath(), routeId);
                    await deleteDoc(docRef);
                    closeModal();
                    // UI will update via onSnapshot listener
                } catch (error) {
                    console.error("Error deleting route:", error);
                    closeModal();
                    showModal("Database Error", "Failed to delete the route. Check console for details.", true);
                }
            });
            
            document.getElementById('cancel-delete-btn').addEventListener('click', closeModal);
        }

        // --- Setup and Main Logic ---
        window.onload = function () {
            // Setup Modal Close Button
            document.getElementById('modal-close-btn').addEventListener('click', closeModal);

            // Initial view check
            if (localStorage.getItem(ADMIN_SECRET_KEY) === 'true') {
                updateUI('admin');
            } else {
                updateUI('student');
            }
            
            // Start Firebase connection
            initializeFirebase();
        }

    </script>
</head>
<body class="bg-gray-100 min-h-screen">
    <div id="app" class="w-full max-w-md space-y-6">
        <!-- App view will be injected here -->
    </div>

    <!-- Custom Modal Structure -->
    <div id="modal-backdrop" class="fixed inset-0 hidden bg-black bg-opacity-50 flex items-center justify-center p-4">
        <div id="modal-content" class="bg-white rounded-xl shadow-2xl max-w-md w-full p-6 relative">
            <button id="modal-close-btn" class="absolute top-3 right-3 text-gray-400 hover:text-gray-600 transition">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
            <h3 id="modal-title" class="text-xl font-bold mb-4 text-gray-900">Modal Title</h3>
            <div id="modal-message" class="text-gray-700">Modal Message Content.</div>
        </div>
    </div>
</body>
</html>
