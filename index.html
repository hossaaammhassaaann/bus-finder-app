<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bus Route Finder - Single File App</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        /* Custom scrollbar styling */
        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: #9ca3af; /* Gray-400 */
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background-color: #6b7280; /* Gray-500 */
        }
    </style>
</head>
<body class="bg-gray-100 font-sans min-h-screen flex items-center justify-center p-4">

    <!-- Main Application Container -->
    <div id="app-container" class="w-full max-w-4xl min-h-[500px] flex items-center justify-center">
        <!-- Content will be rendered here by JavaScript -->
        <div id="loading-spinner" class="text-center p-8 bg-white rounded-xl shadow-lg">
            <div class="w-12 h-12 border-4 border-indigo-400 border-t-transparent border-solid rounded-full animate-spin mx-auto mb-4"></div>
            <p class="text-lg text-indigo-600 font-medium">Connecting to system...</p>
        </div>
    </div>

    <!-- Modals Container -->
    <div id="modal-container"></div>

    <script type="module">
        // --- Firebase Imports ---
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { 
            getFirestore, 
            collection, 
            query, 
            onSnapshot, 
            addDoc, 
            deleteDoc, 
            doc,
            updateDoc, // Added for editing
            setLogLevel 
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Use debug logging for Firestore
        setLogLevel('debug');

        // --- Global Variable Configuration ---
        // Determines if we have the necessary credentials to connect to Firestore
        const IS_SECURE_ENVIRONMENT = typeof __firebase_config !== 'undefined' && typeof __initial_auth_token !== 'undefined';
        
        const firebaseConfig = IS_SECURE_ENVIRONMENT ? JSON.parse(__firebase_config) : {};
        const initialAuthToken = IS_SECURE_ENVIRONMENT ? __initial_auth_token : null;
        const APP_ID = typeof __app_id !== 'undefined' ? __app_id : 'default-bus-finder-app';

        // Application Constants
        const ADMIN_USERNAME = "hossam_hassan";
        const ADMIN_PASSWORD = "hossammm";
        const ADMIN_KEY_LS = "bus_finder_admin_auth"; 

        // Firebase Instances
        let app, db, auth;
        let currentRoutes = [];
        let currentView = 'student'; // 'student' or 'admin'

        // --- Utility Functions ---

        const getCollectionPath = () => `artifacts/${APP_ID}/public/data/routes`;
        const getContainer = () => document.getElementById('app-container');

        // --- Modal & UI Management (replacing alert/confirm) ---

        let modalState = { isOpen: false, title: '', message: '', type: 'message', confirmCallback: null };

        const closeModal = () => {
            modalState.isOpen = false;
            document.getElementById('modal-container').innerHTML = '';
        };

        const handleConfirm = () => {
            if (modalState.confirmCallback) {
                modalState.confirmCallback();
            }
            closeModal();
        };

        const showModal = (title, message, type = 'message', confirmCallback = null, confirmText = 'OK') => {
            modalState = { isOpen: true, title, message, type, confirmCallback, confirmText };

            const isError = type === 'error';
            const isConfirm = type === 'confirm';
            const titleColor = isError ? 'text-red-600' : 'text-gray-900';

            const modalHtml = `
                <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black bg-opacity-50" id="modal-backdrop">
                    <div class="bg-white rounded-xl shadow-2xl max-w-md w-full p-6 relative animate-in zoom-in-50 duration-200">
                        ${!isConfirm ? `
                            <button 
                                class="absolute top-3 right-3 text-gray-400 hover:text-gray-600 transition"
                                onclick="closeModal()"
                                aria-label="Close modal"
                            >
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-6 w-6"><path d="M18 6L6 18M6 6l12 12"/></svg>
                            </button>
                        ` : ''}
                        <h3 class="text-xl font-bold mb-4 ${titleColor}">${title}</h3>
                        <div class="text-gray-700">${message}</div>
                        
                        <div class="flex justify-end mt-6 space-x-3">
                            ${isConfirm ? `
                                <button 
                                    class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 px-4 rounded-lg transition duration-150"
                                    onclick="closeModal()"
                                >
                                    Cancel
                                </button>
                                <button 
                                    class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded-lg transition duration-150 shadow-md"
                                    onclick="handleConfirm()"
                                >
                                    ${modalState.confirmText}
                                </button>
                            ` : `
                                <button 
                                    class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded-lg transition duration-150 shadow-md"
                                    onclick="closeModal()"
                                >
                                    OK
                                </button>
                            `}
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('modal-container').innerHTML = modalHtml;

            // Make global functions accessible to inline event handlers in the generated modal HTML
            window.closeModal = closeModal;
            window.handleConfirm = handleConfirm;
        };
        window.closeModal = closeModal; // Ensure global access for edit modal

        // --- Data Handling ---

        const loadRoutes = () => {
            if (!db) return; // Only run if DB is initialized (i.e., in secure environment)

            const routesCollectionRef = collection(db, getCollectionPath());
            const q = query(routesCollectionRef);

            onSnapshot(q, (snapshot) => {
                const fetchedRoutes = [];
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    const name = data.routeName || data.routeNumber;
                    
                    fetchedRoutes.push({ 
                        id: doc.id, 
                        routeName: String(name || 'Unnamed Route'),
                        busNumber: String(data.busNumber || 'N/A') // Store as string for dropdown value consistency
                    });
                });

                // Sort by route name
                fetchedRoutes.sort((a, b) => a.routeName.localeCompare(b.routeName));

                currentRoutes = fetchedRoutes;
                renderApp(); // Re-render the current view with new data
                console.log("Routes updated:", currentRoutes);
            }, (error) => {
                console.error("Firestore Listener Error:", error);
                // Only show data sync error if we know we successfully initialized Firebase
                if (db) {
                    showModal("Data Sync Error", "Failed to load live route updates. Check console.", 'error');
                }
            });
        };

        // --- Admin Actions ---

        const handleAddRoute = async (e) => {
            e.preventDefault();
            
            if (!db) {
                showModal('Database Unavailable', 'Cannot add routes. This feature is only available in the secure development environment for data persistence.', 'error');
                return;
            }

            const form = e.target;
            const routeName = form['routeName'].value.trim();
            const busNumber = form['busNumber'].value.trim();

            if (!routeName || !busNumber || isNaN(parseInt(busNumber, 10))) {
                showModal('Validation Error', 'Please enter a valid descriptive route name and bus number.', 'error');
                return;
            }

            // Check if routeName already exists (case-insensitive)
            if (currentRoutes.some(r => r.routeName.toUpperCase() === routeName.toUpperCase())) {
                showModal('Conflict', `Route name '${routeName}' already exists.`, 'error');
                return;
            }

            try {
                await addDoc(collection(db, getCollectionPath()), {
                    routeName: routeName,
                    busNumber: parseInt(busNumber, 10),
                    createdAt: Date.now()
                });
                showModal('Success', `Route '${routeName}' (Bus ${busNumber}) added successfully.`, 'message');
                form.reset();
            } catch (error) {
                console.error("Error adding route:", error);
                showModal('Database Error', 'Failed to save the new route. Check console for details.', 'error');
            }
        };

        window.handleDelete = (id, name, bus) => {
            if (!db) {
                showModal('Database Unavailable', 'Cannot delete routes. This feature is only available in the secure development environment for data persistence.', 'error');
                return;
            }

            const confirmDelete = async () => {
                try {
                    await deleteDoc(doc(db, getCollectionPath(), id));
                    showModal('Deletion Complete', `Route '${name}' (Bus ${bus}) successfully removed.`, 'message');
                } catch (error) {
                    console.error("Error deleting route:", error);
                    showModal('Database Error', 'Failed to delete the route. Check console for details.', 'error');
                }
            };

            showModal(
                'Confirm Deletion', 
                `Are you sure you want to delete route '${name}' (Bus ${bus})? This cannot be undone.`, 
                'confirm',
                confirmDelete,
                `Delete ${name}`
            );
        };
        
        // --- Edit Route Functionality ---

        const handleUpdateRoute = async (e) => {
            e.preventDefault();

            if (!db) {
                showModal('Database Unavailable', 'Cannot update routes. This feature is only available in the secure development environment for data persistence.', 'error');
                return;
            }

            const form = e.target;
            const routeId = form['routeId'].value;
            const newRouteName = form['editRouteName'].value.trim();
            const newBusNumber = form['editBusNumber'].value.trim();
            
            if (!newRouteName || !newBusNumber || isNaN(parseInt(newBusNumber, 10))) {
                showModal('Validation Error', 'Please enter a valid descriptive route name and bus number.', 'error');
                return;
            }
            
            // Check for name conflict (excluding the current route being edited)
            if (currentRoutes.some(r => r.id !== routeId && r.routeName.toUpperCase() === newRouteName.toUpperCase())) {
                showModal('Conflict', `Route name '${newRouteName}' already exists for another route.`, 'error');
                return;
            }

            try {
                const routeRef = doc(db, getCollectionPath(), routeId);
                await updateDoc(routeRef, {
                    routeName: newRouteName,
                    busNumber: parseInt(newBusNumber, 10)
                });
                closeModal();
                showModal('Success', `Route updated to '${newRouteName}' (Bus ${newBusNumber}).`, 'message');
            } catch (error) {
                console.error("Error updating route:", error);
                showModal('Database Error', 'Failed to update the route. Check console for details.', 'error');
            }
        };
        window.handleUpdateRoute = handleUpdateRoute; // Expose globally

        window.showEditModal = (routeId, routeName, busNumber) => {
            // Check IS_SECURE_ENVIRONMENT, not db, because db is null in external mode
            if (!IS_SECURE_ENVIRONMENT) {
                 showModal('Database Unavailable', 'Cannot edit routes. This feature is only available in the secure development environment for data persistence.', 'error');
                return;
            }

            const editModalContent = `
                <form id="edit-route-form" onsubmit="handleUpdateRoute(event)" class="space-y-4 p-2">
                    <input type="hidden" name="routeId" value="${routeId}" />
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Route Name</label>
                        <input type="text" id="editRouteName" name="editRouteName" required value="${routeName}"
                                class="mt-1 block w-full border-gray-300 rounded-lg shadow-sm focus:ring-indigo-500 focus:border-indigo-500 p-2" />
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Bus Number</label>
                        <input type="number" id="editBusNumber" name="editBusNumber" required value="${busNumber}"
                                class="mt-1 block w-full border-gray-300 rounded-lg shadow-sm focus:ring-indigo-500 focus:border-indigo-500 p-2" />
                    </div>
                    
                    <div class="flex justify-end pt-4 space-x-3">
                        <button 
                            type="button"
                            class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 px-4 rounded-lg transition duration-150"
                            onclick="closeModal()"
                        >
                            Cancel
                        </button>
                        <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded-lg transition duration-150 shadow-md">
                            Save Changes
                        </button>
                    </div>
                </form>
            `;
            showModal(`Edit Route: ${routeName}`, editModalContent, 'edit');
        };
        window.showEditModal = showEditModal; // Expose globally
        
        // --- Authentication & View Switching ---

        const handleAdminLogin = (e) => {
            e.preventDefault();
            const form = e.target;
            const username = form.elements.username.value;
            const password = form.elements.password.value;

            if (username === ADMIN_USERNAME && password === ADMIN_PASSWORD) {
                // Allows Admin UI access in all environments
                localStorage.setItem(ADMIN_KEY_LS, 'true');
                currentView = 'admin';
                closeModal();
                renderApp();
            } else {
                const errorEl = document.getElementById('login-error');
                errorEl.textContent = 'Invalid credentials. Try again.';
                errorEl.classList.remove('hidden');
            }
        };

        const showLoginModal = () => {
            const authModalContent = `
                <form id="admin-login-form" class="space-y-4 p-2">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Username</label>
                        <input type="text" id="username" name="username" required value=""
                                class="mt-1 block w-full border-gray-300 rounded-lg shadow-sm focus:ring-indigo-500 focus:border-indigo-500 p-2" />
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Password</label>
                        <input type="password" id="password" name="password" required value=""
                                class="mt-1 block w-full border-gray-300 rounded-lg shadow-sm focus:ring-indigo-500 focus:border-indigo-500 p-2" />
                    </div>
                    <p id="login-error" class="text-red-500 text-sm hidden"></p>
                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded-lg transition duration-150 shadow-md">
                        Log In
                    </button>
                </form>
            `;
            showModal("Admin Login", authModalContent, 'auth');
            
            // Re-attach submit listener after modal is rendered
            setTimeout(() => {
                const form = document.getElementById('admin-login-form');
                if (form) {
                    form.addEventListener('submit', handleAdminLogin);
                }
            }, 0);
        };
        window.showLoginModal = showLoginModal; // Expose globally

        const handleLogout = () => {
            localStorage.removeItem(ADMIN_KEY_LS);
            currentView = 'student';
            renderApp();
        };

        // --- View Rendering ---

        const renderStudentView = () => {
            const selectedBusNumber = document.getElementById('route-select')?.value || '';
            const selectedRoute = currentRoutes.find(r => r.busNumber === selectedBusNumber);
            
            // No more dbWarning message is rendered here!

            const content = document.createElement('div');
            content.className = "bg-white p-8 rounded-xl shadow-2xl w-full max-w-lg space-y-6 transition-all duration-300";
            content.innerHTML = `
                <h1 class="text-3xl font-extrabold text-indigo-700 text-center border-b-2 pb-3 mb-4 flex items-center justify-center">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mr-3 h-7 w-7"><path d="M19 17h2v.01"/><path d="M6 17h4v.01"/><path d="M18 10h-1.5c-.7 0-1.5.7-1.5 1.5v3c0 .8.7 1.5 1.5 1.5H22V6c0-2-2-3-3-3H7c-2 0-3 1-3 3v11h14M8 10c-1.5 0-3-1-3-3"/><path d="M18 10a3 3 0 0 0 3-3V5h-5.5"/></svg>
                    Find Your Bus Route
                </h1>
                
                <div class="space-y-4">
                    <label htmlFor="route-select" class="block text-sm font-medium text-gray-700">
                        Select your designated student route:
                    </label>
                    <div class="relative">
                        <select 
                            id="route-select" 
                            class="mt-1 block w-full pl-3 pr-10 py-3 text-base border-gray-300 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 rounded-lg shadow-sm bg-white"
                        >
                            <option value="">-- Select a Route --</option>
                            ${currentRoutes.map(route => `
                                <option value="${route.busNumber}" ${route.busNumber === selectedBusNumber ? 'selected' : ''}>
                                    ${route.routeName}
                                </option>
                            `).join('')}
                        </select>
                    </div>
                    
                    <div id="route-display" class="p-6 mt-4 rounded-xl text-center shadow-lg transition-all duration-300 ${selectedRoute ? 'bg-indigo-50 border border-indigo-200' : 'bg-gray-100 border border-gray-300'}">
                        <p class="text-lg font-semibold text-gray-700 mb-2">
                            ${selectedRoute 
                                ? `<span class="font-bold text-indigo-700">${selectedRoute.routeName}</span> assigned bus:` 
                                : 'Select a route above to view the bus number.'}
                        </p>
                        <p class="text-6xl font-extrabold text-indigo-600 transition-all duration-300">
                            ${selectedRoute ? selectedBusNumber : 'N/A'}
                        </p>
                    </div>
                </div>
                
                <div class="pt-4 border-t mt-6 text-center">
                    <button 
                        onclick="showLoginModal()"
                        class="text-sm text-gray-500 hover:text-indigo-600 transition duration-150 flex items-center mx-auto"
                    >
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4 mr-1"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
                        Admin Log In
                    </button>
                </div>
            `;
            
            getContainer().innerHTML = '';
            getContainer().appendChild(content);

            // Re-attach listener for route selection change
            const selectEl = document.getElementById('route-select');
            if (selectEl) {
                selectEl.addEventListener('change', renderApp); // Renders student view again
            }
        };

        const renderAdminView = () => {
            // Determine if CRUD actions should be disabled (when outside secure environment)
            const disableAdminActions = !IS_SECURE_ENVIRONMENT;

            const dbWarning = disableAdminActions ? `
                <div class="mt-4 p-4 text-center bg-red-100 border border-red-400 text-red-700 rounded-lg">
                    <p class="font-bold">Database Changes Disabled</p>
                    <p class="text-sm">You are viewing static data. Route addition, editing, and deletion require a live database connection.</p>
                </div>
            ` : '';

            const content = document.createElement('div');
            content.className = "bg-white p-8 rounded-xl shadow-2xl w-full max-w-3xl space-y-8";
            
            content.innerHTML = `
                <div class="flex justify-between items-center border-b-2 pb-3">
                    <h1 class="text-3xl font-extrabold text-green-700 flex items-center">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mr-3 h-7 w-7"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg>
                        Bus Route Administration
                    </h1>
                    <button 
                        onclick="handleLogout()"
                        class="text-sm text-red-500 hover:text-red-700 transition duration-150 flex items-center p-2 rounded-lg hover:bg-red-50"
                    >
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 mr-1"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                        Log Out
                    </button>
                </div>

                ${dbWarning}

                <!-- Add Route Form -->
                <div class="bg-gray-50 p-6 rounded-xl shadow-inner border border-gray-200 ${disableAdminActions ? 'opacity-50 pointer-events-none' : ''}">
                    <h2 class="text-xl font-semibold text-gray-800 mb-4 flex items-center">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mr-2 h-5 w-5 text-green-600"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                        Add New Route
                    </h2>
                    <form id="add-route-form" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <input 
                            type="text" 
                            id="routeName"
                            name="routeName"
                            placeholder="Custom Route Name (e.g., Downtown Express)"
                            required
                            class="col-span-1 md:col-span-1 block w-full border-gray-300 rounded-lg shadow-sm focus:ring-green-500 focus:border-green-500 p-3"
                        />
                        <input 
                            type="number" 
                            id="busNumber"
                            name="busNumber"
                            placeholder="Bus Number (e.g., 101)"
                            required
                            class="col-span-1 md:col-span-1 block w-full border-gray-300 rounded-lg shadow-sm focus:ring-green-500 focus:border-green-500 p-3"
                        />
                        <button type="submit" class="col-span-1 w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-lg transition duration-150 shadow-md">
                            Add Route
                        </button>
                    </form>
                </div>

                <!-- Current Routes List -->
                <h2 class="text-xl font-semibold text-gray-800 mt-8 mb-4">
                    Current Routes (${currentRoutes.length} Total)
                </h2>
                <div class="space-y-3 max-h-[300px] overflow-y-auto custom-scrollbar p-1">
                    ${currentRoutes.length === 0 ? `
                        <p class="text-center text-gray-500 p-6 border rounded-xl bg-yellow-50">
                            No routes have been added yet. Use the form above to get started.
                        </p>
                    ` : currentRoutes.map(route => `
                        <div class="flex items-center justify-between bg-white p-2 rounded-xl border border-gray-200 shadow-md transition duration-100 hover:shadow-lg">
                            <!-- EDIT BUTTON (the whole row) -->
                            <button
                                onclick="showEditModal('${route.id}', '${route.routeName}', '${route.busNumber}')"
                                class="flex-1 text-left p-2 focus:outline-none hover:bg-gray-50 rounded-lg transition duration-150"
                                ${disableAdminActions ? 'disabled' : ''}
                            >
                                <span class="text-lg font-medium text-gray-700">
                                    <span class="font-bold text-green-600">${route.routeName}</span>: Bus ${route.busNumber}
                                </span>
                                ${!disableAdminActions ? `
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 inline ml-2 text-gray-400" viewBox="0 0 20 20" fill="currentColor"><path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zm-3.182 3.182l-7 7V17h3.182l7-7-2.828-2.828z"/></svg>
                                ` : ''}
                            </button>
                            <!-- DELETE BUTTON -->
                            <button 
                                onclick="handleDelete('${route.id}', '${route.routeName}', '${route.busNumber}')"
                                class="text-red-500 hover:text-red-700 p-2 rounded-full hover:bg-red-100 transition duration-150 shadow-sm ${disableAdminActions ? 'opacity-50 pointer-events-none' : ''}"
                                aria-label="Delete route ${route.routeName}"
                                ${disableAdminActions ? 'disabled' : ''}
                            >
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
                            </button>
                        </div>
                    `).join('')}
                </div>
            `;
            
            getContainer().innerHTML = '';
            getContainer().appendChild(content);

            // Re-attach form submit listener for Admin view
            if (!disableAdminActions) {
                document.getElementById('add-route-form').addEventListener('submit', handleAddRoute);
            }
        };

        const renderApp = () => {
            document.getElementById('loading-spinner')?.remove();
            getContainer().classList.add('items-start'); // Adjust alignment for content

            if (currentView === 'admin') {
                renderAdminView();
            } else {
                renderStudentView();
            }
        };
        window.handleLogout = handleLogout; // Expose globally
        
        // --- Initialization ---

        const initFirebase = async () => {
            document.getElementById('loading-spinner')?.remove(); // Remove spinner immediately on load

            // 1. Handle External Environment (No Firebase Access)
            if (!IS_SECURE_ENVIRONMENT) {
                console.warn("External environment detected. Firebase connection skipped. Using static data.");
                
                // =======================================================
                // <<< START EDITING STATIC ROUTES HERE >>>
                // Edit the objects below to change the routes shown 
                // in the non-secure (external) environment.
                // =======================================================
                currentRoutes = [
                    { id: 'static-academy', routeName: 'academy, 3esawy', busNumber: '1' }, 
                    { id: 'static-bahr_1', routeName: 'bahr (shatby, camp caesar, ibrahimia, sporting, sidi gaber)', busNumber: '2' },
                    { id: 'static-bahr_2', routeName: 'bahr (roushdy to 45 street)', busNumber: '3' },
                    { id: 'static-sidi_gaber', routeName: 'abo 2eer (shar3 fouad, ibrahimia, sporting, cleopatra, sidi gaber)', busNumber: '4' },
                    { id: 'static-deeb_mall', routeName: 'Smouha, deeb mall, lisabella, esm el raml', busNumber: '5' },
                    { id: 'static-gleem', routeName: 'abo 2eer (gleem, ganaklis, loran, victoria)', busNumber: '6' },
                    { id: 'static-seyouf', routeName: 'Seyouf', busNumber: '7' },
                    { id: 'static-kanat-elsweis', routeName: 'Kanat elsweis', busNumber: '8' }
                ];
                // =======================================================
                // <<< END EDITING STATIC ROUTES HERE >>>
                // =======================================================

                // Check local storage for existing admin session
                if (localStorage.getItem(ADMIN_KEY_LS) === 'true') {
                    currentView = 'admin';
                } else {
                    currentView = 'student';
                }
                
                // Initial render with static data
                renderApp();
                return;
            }

            // 2. Proceed with secure initialization (Only runs in Canvas)
            try {
                app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);
                
                // Sign in using the custom token if provided, otherwise sign in anonymously
                if (initialAuthToken) {
                    await signInWithCustomToken(auth, initialAuthToken);
                } else {
                    await signInAnonymously(auth);
                }
                
                // Check local storage for existing admin session
                if (localStorage.getItem(ADMIN_KEY_LS) === 'true') {
                    currentView = 'admin';
                } else {
                    currentView = 'student';
                }

                loadRoutes(); // Start real-time data listener
                // renderApp() is called by loadRoutes() on the first data snapshot
            } catch (error) {
                console.error("Firebase Initialization Fatal Error:", error);
                // The app will now display whatever data it has (likely the static routes if in external mode, or an empty list if in secure mode).
                renderApp();
            }
        };

        // Start the application when the window loads
        window.addEventListener('load', initFirebase);
    </script>
</body>
